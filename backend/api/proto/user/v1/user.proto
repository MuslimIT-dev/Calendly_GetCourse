syntax = "proto3";

package user.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/MuslimIT-dev/Calendly_GetCourse/backend/api/proto/user/v1;userv1";

// ============================================================
// ENUMS
// ============================================================

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_GLOBAL_ADMIN = 1;
  ROLE_OWNER       = 2;
  ROLE_ADMIN       = 3;
  ROLE_MASTER      = 4;
  ROLE_CLIENT      = 5;
}

// ============================================================
// ENTITIES
// ============================================================

message User {
  string id         = 1;
  string email      = 2;
  string name       = 3;
  string avatar_url = 4;
  string timezone   = 5;
  repeated Role roles = 6;
  bool   email_verified = 7;

  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// ============================================================
// REQUESTS / RESPONSES
// ============================================================

message GetUserRequest {
  string id = 1;
}

message GetUserResponse {
  User user = 1;
}

message GetMeRequest {}

message GetMeResponse {
  User user = 1;
}

message UpdateUserRequest {
  string name       = 1;
  string avatar_url = 2;
  string timezone   = 3;
}

message UpdateUserResponse {
  User user = 1;
}

// ============================================================
// SERVICE
// ============================================================

service UserService {
  // Private
  rpc GetUser(GetUserRequest)                   returns (GetUserResponse);
  rpc GetMe(GetMeRequest)                       returns (GetMeResponse);
  rpc UpdateUser(UpdateUserRequest)             returns (UpdateUserResponse);
}